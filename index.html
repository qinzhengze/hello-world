<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hello-world · Code Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --code-bg: #f6f8fa;
    --tab-active: #0969da;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --code-bg: #161b22;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
      Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 0;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.15rem;
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .brand small {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.85rem;
  }

  nav.tabs {
    display: flex;
    gap: 0.25rem;
  }

  nav.tabs button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.15s ease;
  }

  nav.tabs button:hover {
    color: var(--text);
    background: rgba(140, 140, 140, 0.12);
  }

  nav.tabs button.active {
    color: var(--tab-active);
    background: rgba(9, 105, 218, 0.1);
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .loading {
    color: var(--muted);
    font-style: italic;
    padding: 1rem 0;
  }

  .error {
    background: #ffebe9;
    color: #82071e;
    border: 1px solid #ffcecb;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    margin: 1rem 0;
  }

  @media (prefers-color-scheme: dark) {
    .error { background: #2d1216; color: #ff8a8a; border-color: #6e1f26; }
  }

  /* Markdown content styling */
  .markdown-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem 2.25rem;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4 {
    margin-top: 1.8em;
    margin-bottom: 0.6em;
    line-height: 1.3;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3em;
  }

  .markdown-body h1:first-child,
  .markdown-body h2:first-child { margin-top: 0; }

  .markdown-body h1 { font-size: 1.8rem; }
  .markdown-body h2 { font-size: 1.4rem; }
  .markdown-body h3 { font-size: 1.15rem; border-bottom: none; }

  .markdown-body p { margin: 0.8em 0; }

  .markdown-body a {
    color: var(--accent);
    text-decoration: none;
  }
  .markdown-body a:hover { text-decoration: underline; }

  .markdown-body ul,
  .markdown-body ol { padding-left: 1.6em; }
  .markdown-body li { margin: 0.25em 0; }

  .markdown-body code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15em 0.4em;
    font-size: 0.88em;
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  }

  .markdown-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
  }

  .markdown-body pre code {
    border: none;
    padding: 0;
    background: transparent;
  }

  .markdown-body blockquote {
    margin: 1em 0;
    padding: 0.4em 1em;
    border-left: 4px solid var(--border);
    color: var(--muted);
    background: var(--code-bg);
    border-radius: 0 6px 6px 0;
  }

  .markdown-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
    display: block;
    overflow-x: auto;
  }

  .markdown-body th,
  .markdown-body td {
    border: 1px solid var(--border);
    padding: 0.5em 0.8em;
    text-align: left;
  }

  .markdown-body th {
    background: var(--code-bg);
    font-weight: 600;
  }

  .markdown-body tr:nth-child(even) td {
    background: rgba(140, 140, 140, 0.05);
  }

  .markdown-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 600px) {
    .markdown-body { padding: 1.25rem; }
    .markdown-body h1 { font-size: 1.5rem; }
    nav.tabs button { padding: 0.4rem 0.7rem; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="brand">
      <span class="dot"></span>
      <span>hello-world</span>
      <small>Code Wiki</small>
    </div>
    <nav class="tabs">
      <button id="tab-home" class="active" data-tab="home">首页</button>
      <button id="tab-wiki" data-tab="wiki">Code Wiki</button>
    </nav>
  </div>
</header>

<main>
  <section id="panel-home" class="panel active">
    <div class="markdown-body" id="content-home">
      <p class="loading">加载中…</p>
    </div>
  </section>

  <section id="panel-wiki" class="panel">
    <div class="markdown-body" id="content-wiki">
      <p class="loading">加载中…</p>
    </div>
  </section>
</main>

<footer>
  Powered by GitHub Pages · <a href="https://github.com">GitHub</a>
</footer>

<script>
  // Tab switching
  const tabs = document.querySelectorAll('nav.tabs button');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // Fetch and render markdown
  async function loadMarkdown(url, containerId) {
    const container = document.getElementById(containerId);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      container.innerHTML = marked.parse(text);
    } catch (err) {
      container.innerHTML =
        '<div class="error">无法加载 ' + url + '：' + err.message +
        '<br><small>提示：请通过本地服务器或 GitHub Pages 访问本页面，直接用 file:// 打开可能因跨域限制无法加载 Markdown。</small></div>';
    }
  }

  loadMarkdown('README.md', 'content-home');
  loadMarkdown('CODE_WIKI.md', 'content-wiki');
</script>

</body>
</html>
